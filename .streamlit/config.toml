[theme]
base = "light"

# Sunset — primary accent (buttons, sliders, progress, links)
primaryColor = "#985E6D"

# Soft neutral background — NOT pink, lets Sunset/Stormy do the color work
backgroundColor = "#f7f5f3"

# Stormy — sidebar background, deep blue-gray for real contrast
secondaryBackgroundColor = "#545664"

# Evening — primary text
textColor = "#192231"

font = "sans serif"